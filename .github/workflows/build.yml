name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: timerewind-mod
          path: build/libs/*.jar
          if-no-files-found: error

      # Releases ページに「最新ビルド」として置く（ログイン不要でダウンロードできる）
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "最新ビルド" \
            --notes "コミット ${GITHUB_SHA::7} から自動ビルド。jar を .minecraft/mods に入れてください。" \
            --target "${GITHUB_SHA}"

      # jar ブランチにも置く
      - name: Publish jar branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir out && cp build/libs/*.jar out/
          cd out
          git init -q -b jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jar
